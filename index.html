<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>116年基隆區處勞工教育訓練班意願調查(統計至115/9/15止) 報名人數</title>
<style>
:root{
  --bg:#E9EEED; --panel:#FFFFFF;
  --ink:#0E2226; --ink-2:#3D5559; --muted:#7C9093;
  --rule:#C9D6D5; --rule-soft:#DEE7E6;
  --teal:#0F6A6A; --teal-soft:#B9D4D2; --amber:#D98A1F;
  --c-hit:#C2612F;    /* 已達門檻：橘 */
  --c-miss:#0F6A6A;   /* 未達門檻：綠 */
  --mono:"SF Mono",SFMono-Regular,ui-monospace,Consolas,"Roboto Mono","Noto Sans Mono",monospace;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding:0 20px 70px}
.wrap{max-width:820px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.logo{padding:34px 0 0}
.logo img{display:block;width:212px;height:auto}
header{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;
  padding:22px 0 20px;border-bottom:2px solid var(--ink)}
header .ttl{flex:1 1 340px;min-width:0}
h1{font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
header .sub{color:var(--ink-2);font-size:13px;margin-top:6px;font-family:var(--mono)}
.readout{text-align:right;flex-shrink:0}
.readout .eyebrow{display:block;margin-bottom:6px}
.readout .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:50px;
  font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--teal)}

.bar-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.bar-top .spacer{margin-left:auto}
.linkbtn{font:inherit;background:none;border:none;color:var(--muted);cursor:pointer;
  padding:3px 0;border-bottom:1px solid transparent}
.linkbtn:hover{color:var(--ink)}
.linkbtn[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--amber)}
#editBtn{display:none}
body.admin #editBtn{display:inline-block}
body.admin h1::after{content:"管理模式";font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--amber);vertical-align:9px;margin-left:9px;font-weight:400}

/* ── 名單 ── */
.list{padding:6px 0 0}
.item{padding:15px 0 13px;border-bottom:1px solid var(--rule-soft)}
.item .line{display:grid;grid-template-columns:26px 1fr auto;gap:13px;align-items:baseline}
.item .rank{font-family:var(--mono);font-size:11px;color:var(--muted)}
.item .name{font-size:15.5px;line-height:1.4}
.item .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;
  font-weight:600;color:var(--ink);white-space:nowrap}
.item .n small{font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
.item .track{display:block;height:12px;background:#D5E0DF;border-radius:1px;overflow:hidden;margin:10px 0 0 39px}
.item .fill{display:block;height:100%;background:var(--teal);border-radius:1px;
  transform-origin:left;animation:grow .5s cubic-bezier(.2,.7,.3,1) both}
.item.lead .fill{background:var(--amber)}
.item.zero .n{color:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ── 橫向長條圖 ── */
.hchart{--nameW:196px;--numW:46px;--gap:14px;position:relative;margin:30px 0 4px}
.grid{position:absolute;top:0;bottom:30px;left:calc(var(--nameW) + var(--gap));
  right:calc(var(--numW) + var(--gap));display:flex;justify-content:space-between;pointer-events:none}
.grid i{width:1px;background:var(--rule-soft)}
.grid i:first-child{background:var(--rule)}
.hrow{display:grid;grid-template-columns:var(--nameW) 1fr var(--numW);gap:var(--gap);
  align-items:center;padding:7px 0;position:relative}
.hrow .nm{font-size:14px;line-height:1.35;text-align:right;color:var(--ink)}
.hrow .tr{height:22px;background:transparent;border-left:1px solid transparent}
.hrow .fl{display:block;height:100%;background:var(--c-hit);border-radius:0 2px 2px 0;
  transform-origin:left;animation:grow .55s cubic-bezier(.2,.7,.3,1) both}
.hrow.rest .fl{background:var(--c-miss)}
.hrow.rest .nu{color:var(--ink)}
.hrow .nu{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;
  font-weight:600;color:var(--ink)}
.hrow .nu small{font-size:10px;font-weight:400;color:var(--muted);margin-left:2px}
.hrow.zero .nu{color:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.xaxis{display:grid;grid-template-columns:var(--nameW) 1fr var(--numW);gap:var(--gap);
  margin-top:9px;padding-top:8px}
.xaxis .ticks{grid-column:2;display:flex;justify-content:space-between;
  border-top:1.5px solid var(--ink);padding-top:6px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.chint{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:14px 0 0}

@media (max-width:600px){
  .grid,.xaxis{display:none}
  .hchart{margin-top:20px}
  /* 名稱與人數同一行，長條獨占第二行 */
  .hrow{display:grid;grid-template-columns:1fr auto;gap:7px 12px;
    padding:12px 0;border-bottom:1px solid var(--rule-soft)}
  .hrow .nm{grid-column:1;grid-row:1;text-align:left;font-size:14.5px;line-height:1.4}
  .hrow .nu{grid-column:2;grid-row:1;text-align:right;font-size:16px;white-space:nowrap}
  .hrow .tr{grid-column:1/-1;grid-row:2;height:12px;background:#D5E0DF;
    border-radius:2px;overflow:hidden}
  .hrow .fl{border-radius:2px}
}
.seclab{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding-top:26px;border-top:1px solid var(--rule)}

/* ── 編輯 ── */
#editor{display:none;margin:26px 0;padding:24px;background:var(--panel);
  border:1px solid var(--rule);border-radius:3px}
#editor.on{display:block}
#editor h2{font-size:16px;font-weight:600;margin-bottom:5px}
#editor .hint{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.erow{display:grid;grid-template-columns:1fr 128px 28px;gap:9px;align-items:center;
  padding:6px 0;border-top:1px solid var(--rule-soft)}
.erow input[type=text]{font:inherit;font-size:14px;padding:8px 10px;width:100%;
  border:1px solid var(--rule);border-radius:2px;background:#FBFCFC;color:var(--ink)}
.spin{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:#FBFCFC}
.spin button{font-family:var(--mono);font-size:15px;width:30px;background:#F1F5F4;border:none;
  color:var(--ink-2);cursor:pointer;flex-shrink:0}
.spin button:hover{background:var(--teal);color:#fff}
.spin input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;text-align:center;
  width:100%;min-width:0;border:none;background:none;color:var(--ink);padding:8px 0;-moz-appearance:textfield}
.spin input::-webkit-outer-spin-button,.spin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.del{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;line-height:1}
.del:hover{color:#A33}
#editor .foot{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--sans);font-size:14px;font-weight:500;background:var(--ink);color:#fff;
  border:none;border-radius:2px;padding:11px 20px;cursor:pointer}
.btn:hover{background:var(--teal)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule)}
.btn.ghost:hover{background:none;color:var(--ink);border-color:var(--ink)}
.saved{font-family:var(--mono);font-size:11.5px;color:var(--teal);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.steps{margin-top:16px;padding:13px 15px;background:#F4F7F6;border:1px solid var(--rule-soft);
  border-radius:2px;font-size:12.5px;color:var(--ink-2);line-height:1.75}
.steps b{color:var(--ink);font-weight:600}

footer{padding:32px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
footer a{color:var(--muted)}

@media (max-width:560px){
  body{padding:0 16px 50px}
  .logo{padding-top:26px}
  .logo img{width:168px}
  h1{font-size:20px} .readout .val{font-size:37px}
  .item .track{margin-left:0}
  .item .line{grid-template-columns:22px 1fr auto;gap:10px}
  .erow{grid-template-columns:1fr 110px 26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="ttl">
    <h1 id="title">116年基隆區處勞工教育訓練班意願調查(統計至115/9/15止)</h1>
    <div class="sub" id="updated">更新時間 115/09/08 08:40</div>
  </div>
  <div class="readout">
    <span class="eyebrow">總報名人次</span>
    <span class="val" id="total">123</span>
  </div>
</header>

<div class="bar-top">
  <span id="meta">13 個班別 · 依報名人數排序</span>
  <span class="spacer"></span>
  <button class="linkbtn" id="editBtn" style="border-bottom-color:var(--rule)" aria-pressed="true">更新人數</button>
</div>

<div id="editor" class="">
  <h2>更新報名人數</h2>
  <p class="hint">改完按「下載更新後的網頁」，把下載到的檔案覆蓋原本那個，同仁看到的就是新數字。</p>
  <div id="erows"></div>
  <div class="foot">
    <button class="btn ghost" id="add">新增一個班別</button>
    <button class="btn" id="download">下載更新後的網頁</button>
    <span class="saved" id="saved">已產生檔案</span>
  </div>
  <div class="steps">
    <b>放上 GitHub Pages 的話：</b>下載的檔案名稱固定是 <code>index.html</code>，直接拖到 repo 覆蓋掉舊的就好，一兩分鐘後網址上就會變。<br>
    <b>放網路磁碟機的話：</b>覆蓋掉共用資料夾裡那個檔案即可。
  </div>
</div>

<div class="hchart" id="chart"></div>
<footer id="footer">如需更正請洽人資組吳宇童 分機6513</footer>

</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA=JSON.parse($("data").textContent);
let EDIT=false;

/* 報名達 THRESHOLD 人以上用主色，未達的用灰色 */
const THRESHOLD=10;

function render(){
  $("title").textContent=DATA.title;
  document.title=DATA.title+" 報名人數";
  $("updated").textContent=DATA.updated?"更新時間 "+DATA.updated:"";

  const list=DATA.classes.map((c,i)=>({...c,c:Number(c.c)||0,i}));
  const total=list.reduce((s,x)=>s+x.c,0);
  const max=Math.max(1,...list.map(x=>x.c));
  $("total").textContent=total;
  $("meta").textContent=`${list.length} 個班別 · 依報名人數排序`;

  const view=[...list].sort((a,b)=>b.c-a.c||a.i-b.i);

  drawChart(view,max);
  $("footer").textContent=DATA.footer||"";
}

/* ── 直式長條圖 ── */
function niceMax(v,ticks){
  if(v<=0) return ticks;
  const ivs=[1,2,3,4,5,6,8,10,12,15,20,25,30,40,50,60,75,100,150,200,250,500,1000];
  const raw=v/ticks;
  for(const iv of ivs){ if(iv>=raw) return iv*ticks; }
  return Math.ceil(raw/1000)*1000*ticks;
}

function drawChart(view,max){
  const ticks=4, top=niceMax(Math.max(max,THRESHOLD),ticks);
  const grid='<div class="grid">'+Array.from({length:ticks+1},()=>"<i></i>").join("")+'</div>';
  const rows=view.map((x,k)=>`
    <div class="hrow${x.c>=THRESHOLD?"":" rest"}${x.c===0?" zero":""}">
      <span class="nm">${esc(x.n)}</span>
      <span class="tr"><span class="fl" style="width:${(x.c/top*100).toFixed(2)}%;animation-delay:${k*30}ms"></span></span>
      <span class="nu">${x.c}<small>人</small></span>
    </div>`).join("");
  const axis='<div class="xaxis"><div class="ticks">'+
    Array.from({length:ticks+1},(_,i)=>`<span>${Math.round(top/ticks*i)}</span>`).join("")+'</div></div>';
  $("chart").innerHTML=grid+rows+axis;
}

function renderEditor(){
  $("erows").innerHTML=DATA.classes.map((c,i)=>`
    <div class="erow">
      <input type="text" value="${esc(c.n)}" data-name="${i}" placeholder="班別名稱">
      <span class="spin">
        <button data-step="-1" data-i="${i}" aria-label="減一">−</button>
        <input type="number" min="0" value="${Number(c.c)||0}" data-count="${i}">
        <button data-step="1" data-i="${i}" aria-label="加一">+</button>
      </span>
      <button class="del" data-del="${i}" aria-label="刪除這個班別">×</button>
    </div>`).join("");

  $("erows").oninput=e=>{
    const t=e.target;
    if(t.dataset.name!==undefined) DATA.classes[t.dataset.name].n=t.value;
    if(t.dataset.count!==undefined) DATA.classes[t.dataset.count].c=Math.max(0,Number(t.value)||0);
    render();
  };
  $("erows").onclick=e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.del!==undefined){
      if(confirm("刪除「"+DATA.classes[b.dataset.del].n+"」？")){
        DATA.classes.splice(b.dataset.del,1); renderEditor(); render();
      }
    }
    if(b.dataset.step!==undefined){
      const i=b.dataset.i;
      DATA.classes[i].c=Math.max(0,(Number(DATA.classes[i].c)||0)+Number(b.dataset.step));
      $("erows").querySelector(`[data-count="${i}"]`).value=DATA.classes[i].c;
      render();
    }
  };
}

/* 把目前數字烤回檔案，產生一份新的 index.html */
function download(){
  const d=new Date(), z=n=>String(n).padStart(2,"0");
  DATA.updated=`${d.getFullYear()-1911}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  $("data").textContent="\n"+JSON.stringify(DATA,null,2)+"\n";
  $("updated").textContent="更新時間 "+DATA.updated;

  // 清掉執行期產生的內容再序列化，避免檔案愈存愈肥
  const chartHTML=$("chart").innerHTML, rowsHTML=$("erows").innerHTML;
  $("chart").innerHTML=""; $("erows").innerHTML=""; $("editor").classList.remove("on");
  const wasAdmin=document.body.classList.contains("admin");
  document.body.classList.remove("admin");

  const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;

  document.body.classList.toggle("admin",wasAdmin);
  $("chart").innerHTML=chartHTML; $("erows").innerHTML=rowsHTML;
  if(EDIT) $("editor").classList.add("on");

  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
  a.download="index.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $("saved").classList.add("on");
  setTimeout(()=>$("saved").classList.remove("on"),2500);
}

$("add").onclick=()=>{DATA.classes.push({n:"",c:0});renderEditor();render();
  $("erows").querySelector(".erow:last-child input").focus()};
$("download").onclick=download;

/* 管理模式：網址結尾加 #edit，或在標題上快速點兩下 */
function admin(on){
  document.body.classList.toggle("admin",on);
  if(!on){ EDIT=false; $("editor").classList.remove("on"); }
}
if(location.hash==="#edit") admin(true);
$("title").ondblclick=()=>admin(!document.body.classList.contains("admin"));
$("editBtn").onclick=()=>{
  EDIT=!EDIT;
  $("editor").classList.toggle("on",EDIT);
  $("editBtn").setAttribute("aria-pressed",EDIT);
  if(EDIT){ renderEditor(); $("editor").scrollIntoView({behavior:"smooth",block:"nearest"}); }
};

render();
</script>


</body></html>
